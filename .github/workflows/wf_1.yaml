name: CI/CD pipeline

on:
  push:
    branches: [main2]
  pull_request:
    branches: [main2]

jobs:
  # Unit Тесты и анализ покрытия кода
  test_and_coverage:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start required isolated services for tests
        run: |
          echo "POSTGRES_USER=postgres" >> .env
          echo "POSTGRES_PASSWORD=postgres" >> .env
          echo "POSTGRES_DB=postgres" >> .env
          echo "ORDER_DB_USER=order_admin" >> .env
          echo "ORDER_DB_PASSWORD=order_pass" >> .env
          echo "INV_DB_USER=inv_admin" >> .env
          echo "INV_DB_PASSWORD=inv_pass" >> .env
          echo "RMQ_USER=rmquser" >> .env
          echo "RMQ_PASSWORD=rmqpass" >> .env
          echo "MINIO_ROOT_USER=miniouser" >> .env
          echo "MINIO_ROOT_PASSWORD=miniopass" >> .env
          echo "ORDER_PORT=8001" >> .env
          echo "INVENTORY_PORT=8002" >> .env

          docker compose up -d postgres rabbitmq minio

          # Ожидание готовности БД
          echo "Waiting for PostgreSQL to start..."
          until docker compose exec -T postgres pg_isready -U postgres -d postgres; do
            sleep 2
          done

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov asyncio httpx
          # Устанавливаем все зависимости
          for req in $(find services -name "requirements*.txt"); do pip install -r $req; done

      - name: Run Pytest over tests
        run: |
          # 1. Тесты инвентаря
          export PYTHONPATH="$(pwd):$(pwd)/services/inventory-service"
          pytest services/tests/test_inventory_logic.py --cov=services/inventory-service --cov-report=term --cov-report=xml

          # 2. Тесты заказов
          export PYTHONPATH="$(pwd):$(pwd)/services/order-service"
          pytest services/tests/test_order_logic.py --cov=services/order-service --cov-report=xml --cov-report=term

          # 3. Тесты адаптера
          export PYTHONPATH="$(pwd):$(pwd)/services/slicer-adapter"
          pytest services/slicer-adapter/tests/ --cov=services/slicer-adapter --cov-report=xml --cov-report=term
        continue-on-error: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  # SAST на весь handwritten код проекта
  security_sast:
    name: SAST
    needs: test_and_coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit on handwritten services
        run: bandit -r services/order-service services/inventory-service services/slicer-adapter -x "*/tests/*","*test_*\.py" # -lll -iii
        continue-on-error: true

  # Build + SCA
  build_i_sca:
    name: Build and SCA
    runs-on: ubuntu-latest
    needs: security_sast
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Order Service image
        run: docker build -t order-service:test ./services/order-service

      - name: Build Inventory Service image
        run: docker build -t inventory-service:test ./services/inventory-service

      - name: Build Slicer Adapter image
        run: docker build -t slicer-adapter:test ./services/slicer-adapter

      - name: Scan Order Service image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: order-service:test
          format: table
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'
          scanners: 'vuln,secret'
          exit-code: '0'

      - name: Scan Inventory Service image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: inventory-service:test
          format: table
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'
          scanners: 'vuln,secret'
          exit-code: '0'

      - name: Scan Slicer Adapter image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: slicer-adapter:test
          format: table
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'
          scanners: 'vuln,secret'
          exit-code: '0'

  # Deploy step: на домашнем сервере
  deploy:
    name: Deploy to Production
    runs-on: self-hosted
    needs: build_i_sca
    if: github.ref == 'refs/heads/main2'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Decrypt secrets
        run: |
          # SOPS автоматом подхватит ключ из переменной окружения на сервере
          sops --decrypt --input-type dotenv --output-type dotenv infra/sops/secrets.enc.env > .env

      - name: Start Docker Compose
        run: |
          docker compose up -d --build

