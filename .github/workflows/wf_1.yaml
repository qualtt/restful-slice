name: CI/CD pipeline

on:
  push:
    branches: [main2]
  pull_request:
    branches: [main2]

jobs:
  # SAST на весь handwritten код проекта
  security_sast:
    name: SAST
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit on handwritten services
        run: bandit -r services/order-service services/inventory-service services/slicer-adapter -ll -ii

  # Build + SCA: собираем Docker образы и сканируем их на уязвимости
  build_i_sca:
    name: Build and SCA
    runs-on: ubuntu-latest
    needs: security_sast
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Order Service image
        run: docker build -t order-service:test ./services/order-service

      - name: Build Inventory Service image
        run: docker build -t inventory-service:test ./services/inventory-service

      - name: Build Slicer Adapter image
        run: docker build -t slicer-adapter:test ./services/slicer-adapter

      - name: Scan Order Service image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: order-service:test
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'

      - name: Scan Inventory Service image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: inventory-service:test
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'

      - name: Scan Slicer Adapter image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: slicer-adapter:test
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'

  # Deploy step: Разворачиваем сразу на домашнем сервере
  deploy:
    name: Deploy to Production
    runs-on: self-hosted
    needs: build_i_sca
    if: github.ref == 'refs/heads/main2'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Decrypt secrets
        run: |
          # SOPS автоматом подхватит ключ из переменной окружения на сервере
          sops --decrypt --input-type dotenv --output-type dotenv infra/sops/secrets.enc.env > .env

      - name: Start Docker Compose
        run: |
          docker compose up -d --build
