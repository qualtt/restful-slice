name: CI/CD pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# GHCR (push образов) + GHA cache (BuildKit type=gha) для ускорения повторных сборок.
permissions:
  contents: read
  packages: write
  actions: write

jobs:
  # 1. Unit Тесты и анализ покрытия кода (БЕЗ ИЗМЕНЕНИЙ)
  test_and_coverage:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Start required isolated services for tests
        run: |
          echo "POSTGRES_USER=postgres" >> .env
          echo "POSTGRES_PASSWORD=postgres" >> .env
          echo "POSTGRES_DB=postgres" >> .env
          echo "ORDER_DB_USER=order_admin" >> .env
          echo "ORDER_DB_PASSWORD=order_pass" >> .env
          echo "INV_DB_USER=inv_admin" >> .env
          echo "INV_DB_PASSWORD=inv_pass" >> .env
          echo "RMQ_USER=rmquser" >> .env
          echo "RMQ_PASSWORD=rmqpass" >> .env
          echo "MINIO_ROOT_USER=miniouser" >> .env
          echo "MINIO_ROOT_PASSWORD=miniopass" >> .env
          echo "ORDER_PORT=8001" >> .env
          echo "INVENTORY_PORT=8002" >> .env

          docker compose up -d postgres rabbitmq minio

          echo "Waiting for PostgreSQL to start..."
          until docker compose exec -T postgres pg_isready -U postgres -d postgres; do
            sleep 2
          done

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov asyncio httpx
          for req in $(find services -name "requirements*.txt"); do pip install -r $req; done

      - name: Run Pytest over tests
        run: |
          export PYTHONPATH="$(pwd):$(pwd)/services/inventory-service"
          pytest services/tests/test_inventory_logic.py --cov=services/inventory-service --cov-report=term-missing --cov-report=xml --cov-append
          pytest services/tests/test_inventory_profiles_api.py --cov=services/inventory-service --cov-report=term-missing --cov-report=xml --cov-append

          export PYTHONPATH="$(pwd):$(pwd)/services/order-service"
          pytest services/tests/test_order_logic.py --cov=services/order-service --cov-report=term-missing --cov-report=xml --cov-append

          export PYTHONPATH="$(pwd):$(pwd)/services/slicer-adapter"
          pytest services/slicer-adapter/tests/ --cov=services/slicer-adapter --cov-report=term-missing --cov-report=xml --cov-append
        continue-on-error: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  # 2. SAST на весь handwritten код проекта (БЕЗ ИЗМЕНЕНИЙ)
  security_sast:
    name: SAST
    needs: test_and_coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit on handwritten services
        run: bandit -r services/order-service services/inventory-service services/slicer-adapter -x "*/tests/*","*test_*\.py"
        continue-on-error: true

  # 3. API проверки через Newman
  api_postman:
    name: API Smoke / E2E
    needs: test_and_coverage
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install Newman
        run: npm install --global newman

      - name: Prepare compose environment
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=postgres_admin
          POSTGRES_PASSWORD=postgres_secret
          POSTGRES_DB=postgres_admin
          POSTGRES_HOST=postgres
          POSTGRES_PORT=5432
          ORDER_DB_USER=order_svc
          ORDER_DB_PASSWORD=order_secret_123
          ORDER_DB_NAME=orders_db
          INV_DB_USER=inv_svc
          INV_DB_PASSWORD=inv_secret_123
          INV_DB_NAME=inventory_db
          RMQ_USER=rmq_admin
          RMQ_PASSWORD=rmq_secret_pass
          RABBITMQ_USER=rmq_admin
          RABBITMQ_PASSWORD=rmq_secret_pass
          RABBITMQ_HOST=rabbitmq
          RABBITMQ_PORT=5672
          MINIO_ROOT_USER=minioadmin
          MINIO_ROOT_PASSWORD=minio_secret_123
          MINIO_ENDPOINT=minio:9000
          MINIO_BUCKET_NAME=3d-models
          ORDER_PORT=8080
          INVENTORY_PORT=8081
          INVENTORY_URL=http://inventory_service:8081
          MAX_UPLOAD_SIZE_MB=100
          LOG_LEVEL=INFO
          EOF

      - name: Start lightweight API stack for non-main refs
        if: github.ref != 'refs/heads/main'
        run: docker compose up --build -d postgres rabbitmq minio inventory_service order_service gateway

      - name: Start full API stack for main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker compose up --build -d

      - name: Wait for base API stack
        run: |
          echo "Waiting for PostgreSQL..."
          until docker compose exec -T postgres pg_isready -U postgres_admin -d postgres_admin; do
            sleep 2
          done

          echo "Waiting for RabbitMQ health..."
          until [ "$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}unknown{{end}}' "$(docker compose ps -q rabbitmq)")" = "healthy" ]; do
            sleep 2
          done

          echo "Waiting for MinIO health..."
          until [ "$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}unknown{{end}}' "$(docker compose ps -q minio)")" = "healthy" ]; do
            sleep 2
          done

          echo "Waiting for gateway..."
          until curl -fsS http://localhost/health >/dev/null; do
            sleep 2
          done

          echo "Waiting for API via gateway..."
          until curl -fsS "http://localhost/api/inventory/profiles?page=1&pageSize=1" >/dev/null; do
            sleep 2
          done

          echo "Waiting for SPA shell via gateway..."
          until curl -fsS http://localhost/ | grep -q 'id="root"'; do
            sleep 2
          done

      - name: Load slicer fixtures into MinIO
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: bash infra/scripts/load-fixtures.sh

      - name: Wait for slicer services on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "Waiting for slicer_api health..."
          until [ "$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}unknown{{end}}' "$(docker compose ps -q slicer_api)")" = "healthy" ]; do
            sleep 2
          done

          echo "Waiting for slicer_adapter worker..."
          until docker compose exec -T slicer_adapter python -c "import urllib.request; r = urllib.request.urlopen('http://localhost:8080/health'); raise SystemExit(0 if r.status == 200 else 1)" >/dev/null 2>&1; do
            sleep 2
          done

      - name: Run lightweight Newman collections
        run: |
          newman run tests/postman/restful-slice-api-e2e.postman_collection.json \
            --environment tests/postman/restful-slice-local.postman_environment.json \
            --env-var "sampleModelPath=${GITHUB_WORKSPACE}/tests/postman/fixtures/cube.stl" \
            --env-var "invalidFilePath=${GITHUB_WORKSPACE}/tests/postman/fixtures/not-a-model.txt" \
            --folder "Negative smoke" \
            --delay-request 1000

          newman run tests/postman/restful-slice-openapi-contract.postman_collection.json \
            --environment tests/postman/restful-slice-local.postman_environment.json \
            --env-var "sampleModelPath=${GITHUB_WORKSPACE}/tests/postman/fixtures/cube.stl" \
            --env-var "invalidFilePath=${GITHUB_WORKSPACE}/tests/postman/fixtures/not-a-model.txt" \
            --folder "Inventory" \
            --folder "Orders - Upload" \
            --folder "Orders - Lifecycle" \
            --folder "Orders - Errors" \
            --delay-request 1000

      - name: Run full happy-path collection on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          newman run tests/postman/restful-slice-api-e2e.postman_collection.json \
            --environment tests/postman/restful-slice-local.postman_environment.json \
            --env-var "sampleModelPath=${GITHUB_WORKSPACE}/tests/postman/fixtures/cube.stl" \
            --env-var "invalidFilePath=${GITHUB_WORKSPACE}/tests/postman/fixtures/not-a-model.txt" \
            --folder "Happy path" \
            --delay-request 2000 \
            --export-environment /tmp/restful-slice-happy-env.json

      - name: Verify sliced G-code in MinIO on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          ORDER_ID="$(
            python3 - <<'PY'
          import json
          with open('/tmp/restful-slice-happy-env.json', encoding='utf-8') as fh:
              values = {item["key"]: item.get("value", "") for item in json.load(fh)["values"]}
          print(values.get("orderId", ""))
          PY
          )"

          if [ -z "$ORDER_ID" ]; then
            echo "orderId was not exported by Newman"
            exit 1
          fi

          MINIO_CONTAINER_ID="$(docker compose ps -q minio)"
          BACKEND_NETWORK="$(
            docker inspect "$MINIO_CONTAINER_ID" \
              --format '{{range $name, $_ := .NetworkSettings.Networks}}{{println $name}}{{end}}' \
              | head -n 1 \
              | tr -d '[:space:]'
          )"

          docker run --rm \
            --network "$BACKEND_NETWORK" \
            --entrypoint sh \
            minio/mc -c "
              mc alias set local http://minio:9000 minioadmin minio_secret_123 >/dev/null
              mc stat local/3d-models/gcode/orders/$ORDER_ID/result.gcode
              mc cat local/3d-models/gcode/orders/$ORDER_ID/result.gcode | head -n 5
            "

      - name: Tear down API stack
        if: always()
        run: docker compose down -v --remove-orphans

  # 4. Build + SCA + Push в GHCR: параллельно по образам + BuildKit cache (GHA), без платных API.
  build_i_sca:
    name: "Build, SCA, Push (${{ matrix.id }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: postgres
            image_name: postgres
            context: ./infra/postgres
            target: ""
            cache_scope: postgres
          - id: order-service
            image_name: order-service
            context: ./services/order-service
            target: production
            cache_scope: order-service
          - id: inventory-service
            image_name: inventory-service
            context: ./services/inventory-service
            target: production
            cache_scope: inventory-service
          - id: slicer-api
            image_name: slicer-api
            context: "https://github.com/qualtt/orca-slicer-api.git#main"
            target: ""
            cache_scope: slicer-api
            build_args: |
              ORCASLICER_VERSION=2.3.0
              TARGETARCH=amd64
          - id: slicer-adapter
            image_name: slicer-adapter
            context: ./services/slicer-adapter
            target: production
            cache_scope: slicer-adapter
          - id: frontend
            image_name: frontend
            context: ./apps/frontend
            target: ""
            cache_scope: frontend
    # needs:
    #  - security_sast
    #  - api_postman
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lower case owner name
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Отдельные вызовы: у postgres нет target; у slicer-api — только build-args и git context.
      - name: Build image — service (multi-stage target)
        if: |
          matrix.id == 'order-service' || matrix.id == 'inventory-service' || matrix.id == 'slicer-adapter'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          pull: true
          push: false
          load: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ env.REPO_LC }}/${{ matrix.image_name }}:latest
            ghcr.io/${{ env.REPO_LC }}/${{ matrix.image_name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: ${{ github.event_name == 'push' && format('type=gha,mode=max,scope={0}', matrix.cache_scope) || '' }}

      - name: Build image — frontend (SPA)
        if: matrix.id == 'frontend'
        uses: docker/build-push-action@v7
        with:
          context: ./apps/frontend
          file: ./apps/frontend/Dockerfile
          pull: true
          push: false
          load: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ env.REPO_LC }}/frontend:latest
            ghcr.io/${{ env.REPO_LC }}/frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=frontend' || '' }}

      - name: Build image — postgres (single-stage)
        if: matrix.id == 'postgres'
        uses: docker/build-push-action@v7
        with:
          context: ./infra/postgres
          pull: true
          push: false
          load: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ env.REPO_LC }}/postgres:latest
            ghcr.io/${{ env.REPO_LC }}/postgres:${{ github.sha }}
          cache-from: type=gha,scope=postgres
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=postgres' || '' }}

      - name: Build image — slicer-api (remote git context)
        if: matrix.id == 'slicer-api'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          build-args: ${{ matrix.build_args }}
          pull: true
          push: false
          load: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ env.REPO_LC }}/slicer-api:latest
            ghcr.io/${{ env.REPO_LC }}/slicer-api:${{ github.sha }}
          cache-from: type=gha,scope=slicer-api
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=slicer-api' || '' }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ env.REPO_LC }}/${{ matrix.image_name }}:latest
          format: table
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'
          scanners: 'vuln,secret'
          exit-code: '0'

      - name: Push image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push ghcr.io/${{ env.REPO_LC }}/${{ matrix.image_name }}:latest

      - name: Push immutable image tag to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push ghcr.io/${{ env.REPO_LC }}/${{ matrix.image_name }}:${{ github.sha }}


  # 4. Deploy step: на домашнем сервере (АДАПТИРОВАНО ПОД SWARM)
  deploy:
    name: Deploy to Swarm Cluster
    runs-on: self-hosted
    needs: build_i_sca
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Раннер логинится в GHCR от лица сервера, чтобы иметь права скачать образы
      - name: Log in to the Container registry on server
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Decrypt secrets
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          sops --decrypt --input-type dotenv --output-type dotenv infra/sops/secrets.enc.env > .env

      # - name: Deploy to Docker Swarm
      #   run: |
      #     # Экспортируем все переменные из .env в окружение
      #     # Правильный и безопасный парсинг .env файла
      #     set -a
      #     source .env
      #     set +a


      #     # Запускаем деплой (он подхватит переменные, так как они в export)
      #     docker stack deploy --with-registry-auth -c docker-stack.yml restful-slice
      #     cd infra/monitoring && docker stack deploy -c docker-stack-monitor.yml monitoring
      - name: Deploy to Docker Swarm
        run: |
          stack_deploy_with_retry() {
            local max_attempts="$1"
            shift
            local attempt=1
            local output
            local status

            while true; do
              echo "===== STACK DEPLOY ATTEMPT $attempt/$max_attempts ====="
              set +e
              output="$("$@" 2>&1)"
              status=$?
              set -e
              printf '%s\n' "$output"

              if [ "$status" -eq 0 ]; then
                return 0
              fi

              if printf '%s\n' "$output" | grep -q "update out of sequence" && [ "$attempt" -lt "$max_attempts" ]; then
                echo "Transient Swarm update race detected; retrying in 10 seconds..."
                attempt=$((attempt + 1))
                sleep 10
                continue
              fi

              return "$status"
            done
          }

          # 0. ДЕБАГ: Выводим все КЛЮЧИ из .env файла (скрывая пароли),
          # чтобы ты 100% увидел, есть ли там ORDER_DB_USER!
          echo "=== SODERZHIMOE .ENV (SECRETS HIDDEN) ==="
          sed 's/=.*/=***/' .env
          echo "========================================="

          # 1. Загружаем переменные из .env в окружение Bash
          set -a
          source .env
          set +a

          # Версии для immutable Swarm configs (имена в docker-stack.yml используют ${...}).
          export BOOTSTRAP_VERSION="$(sha256sum infra/postgres/bootstrap.sql | cut -c1-12)"
          export GATEWAY_CONF_VERSION="$(cat infra/nginx/default.conf.template infra/nginx/restful-slice-gateway.conf | sha256sum | cut -c1-12)"
          echo "BOOTSTRAP_VERSION=$BOOTSTRAP_VERSION"
          echo "GATEWAY_CONF_VERSION=$GATEWAY_CONF_VERSION"

          # Общая overlay между postgres-ha и restful-slice (должна существовать до обоих stack deploy).
          export RESTFUL_BACKEND_NET_NAME="${RESTFUL_BACKEND_NET_NAME:-restful-slice_backend_net}"
          docker network inspect "$RESTFUL_BACKEND_NET_NAME" >/dev/null 2>&1 \
            || docker network create -d overlay --attachable "$RESTFUL_BACKEND_NET_NAME"

          # Spilo/post_init требует роль postgres — не подставляйте сюда POSTGRES_USER приложения (часто postgres_admin).
          export POSTGRES_SUPERUSER="${POSTGRES_SUPERUSER:-postgres}"
          export POSTGRES_SUPERUSER_PASSWORD="${POSTGRES_SUPERUSER_PASSWORD:-$POSTGRES_PASSWORD}"

          export POSTGRES_HA_HAPROXY_CFG_VERSION="$(sha256sum infra/patroni/haproxy.cfg | cut -c1-12)"
          echo "POSTGRES_HA_HAPROXY_CFG_VERSION=$POSTGRES_HA_HAPROXY_CFG_VERSION"

          echo "===== DEPLOY Postgres HA stack (postgres-ha) ====="
          docker stack deploy --with-registry-auth -c infra/patroni/stack.yml postgres-ha

          echo "===== WAIT postgres-ha все сервисы в строю (до ~15 мин) ====="
          bash infra/scripts/wait-postgres-ha.sh

          # 2. Подставляем ТОЛЬКО нужные переменные — полный envsubst съедает $ внутри
          # встроенных shell/python-блоков и ломает YAML.
          vars='$POSTGRES_SUPERUSER $POSTGRES_SUPERUSER_PASSWORD'
          vars="$vars "'$POSTGRES_USER $POSTGRES_PASSWORD'
          vars="$vars "'$RMQ_USER $RMQ_PASSWORD $MINIO_ROOT_USER $MINIO_ROOT_PASSWORD $MINIO_BUCKET_NAME'
          vars="$vars "'$ORDER_PORT $INVENTORY_PORT'
          vars="$vars "'$ORDER_DB_USER $ORDER_DB_PASSWORD $ORDER_DB_NAME'
          vars="$vars "'$INV_DB_USER $INV_DB_PASSWORD $INV_DB_NAME'
          vars="$vars "'$IMAGE_TAG'
          vars="$vars "'$BOOTSTRAP_VERSION $GATEWAY_CONF_VERSION'
          export IMAGE_TAG="$GITHUB_SHA"
          envsubst "$vars" < docker-stack.yml > stack-resolved.yml

          echo "===== RESOLVED STACK CHECK ====="

          grep -A12 "db_bootstrap:" stack-resolved.yml | head -20

          grep -A22 "order_service:" stack-resolved.yml | head -30

          grep -A15 "frontend:" stack-resolved.yml | head -20

          # После envsubst смотреть PGUSER/PGPASSWORD у db_bootstrap (POSTGRES_SUPERUSER).
          grep "PGUSER=" stack-resolved.yml
          grep "ORDER_DB_USER" stack-resolved.yml

          # (Опционально) Можешь раскомментировать нижнюю строку, чтобы убедиться,
          # что пароли реально вписались в файл (потом закомментируй, чтобы не светить в логах!)
          # cat stack-resolved.yml

          # 3. Деплоим уже собранный манифест со вшитыми паролями
          stack_deploy_with_retry 3 docker stack deploy --with-registry-auth --prune -c stack-resolved.yml restful-slice

          # 3.1. На Swarm одного stack deploy недостаточно: команда возвращается,
          # пока rollout ещё идет в фоне. Принудительно дожидаемся обновления
          # API-сервисов, иначе workflow может завершиться success на старом рантайме.
          docker service update --detach=false --force --with-registry-auth restful-slice_order_service
          docker service update --detach=false --force --with-registry-auth restful-slice_inventory_service

          echo "===== VERIFY API DOCS ASSETS ====="
          curl -fsS "http://127.0.0.1/api/orders/docs-assets/swagger-ui/docs-bootstrap.js" >/dev/null
          curl -fsS "http://127.0.0.1/api/inventory/docs-assets/swagger-ui/docs-bootstrap.js" >/dev/null

          # 4. Аналогично для мониторинга
          cd infra/monitoring
          envsubst < docker-stack-monitor.yml > stack-resolved-monitor.yml
          stack_deploy_with_retry 3 docker stack deploy -c stack-resolved-monitor.yml monitoring

      - name: Load MinIO fixtures into Swarm stack
        run: |
          if command -v timeout >/dev/null 2>&1; then
            timeout --signal=TERM --kill-after=30s 5m \
              env STACK_NAME=restful-slice bash infra/scripts/load-fixtures-stack.sh
          else
            STACK_NAME=restful-slice bash infra/scripts/load-fixtures-stack.sh
          fi

      - name: Debug swarm envs
        run: |
          docker stack services postgres-ha || true
          docker service inspect postgres-ha_pg_haproxy >/dev/null 2>&1 && docker service inspect postgres-ha_pg_haproxy || echo "postgres-ha_pg_haproxy missing"
