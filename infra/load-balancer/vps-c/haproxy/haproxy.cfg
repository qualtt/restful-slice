# Пример /etc/haproxy/haproxy.cfg — TLS + активные HTTP health-checks к двум gateway.
# Установка: apt install haproxy
# Upstream gateway заданы IP: 155.212.221.216 (gw1), 5.181.109.6 (gw2), порт 80.
#
# Получение TLS:
#   - DNS-01: certbot с плагином провайдера (80 не нужен).
#   - Или кратко остановить HAProxy и: certbot certonly --standalone -d example.com -d www.example.com
#
# Сборка PEM для bind *:443 ssl crt ... (после того как fullchain.pem и privkey.pem уже на диске):
#   sudo mkdir -p /etc/haproxy/certs
#   sudo sh -c 'cat /etc/letsencrypt/live/example.com/fullchain.pem /etc/letsencrypt/live/example.com/privkey.pem > /etc/haproxy/certs/example.com.pem'
#   sudo chmod 640 /etc/haproxy/certs/example.com.pem; sudo chown root:haproxy /etc/haproxy/certs/example.com.pem

global
    log /dev/log local0
    maxconn 40000

defaults
    log     global
    mode    http
    option  dontlognull
    option  http-server-close
    option  forwardfor except 127.0.0.0/8
    timeout connect 5s
    timeout client  60s
    timeout server  60s

frontend fe_http
    bind *:80
    mode http
    http-request redirect scheme https code 301

frontend fe_https
    bind *:443 ssl crt /etc/haproxy/certs/example.com.pem alpn h2,http/1.1
    mode http
    default_backend be_gateways

backend be_gateways
    balance leastconn
    option httpchk GET /health
    http-check expect status 200
    default-server inter 3s rise 2 fall 3
    server gw1 155.212.221.216:80 check
    server gw2 5.181.109.6:80 check

# Опционально: статистика (закройте firewall / пароль)
