# HAProxy отправляет клиентские TCP :5432 на инстанс, у которого Patroni REST
# на :8008 отвечает 200 на GET /leader (активный primary).
global
    maxconn 200

defaults
    log stdout format raw local0
    mode tcp
    retries 2
    timeout client 30m
    timeout connect 5s
    timeout server 30m
    timeout check 5s

listen postgres_rw
    bind *:5432
    option httpchk GET /leader
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server spilo_a patroni_spilo_a:5432 check port 8008
    server spilo_b patroni_spilo_b:5432 check port 8008
    server spilo_c patroni_spilo_c:5432 check port 8008

listen stats_http
    mode http
    bind *:7000
    stats enable
    stats uri /
