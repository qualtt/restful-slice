version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    volumes:
      - prometheus_data:/prometheus
      # Swarm service discovery + relabel instance → node hostname (не IP таска)
      - /var/run/docker.sock:/var/run/docker.sock:ro
    configs:
      # Swarm: содержимое config менять нельзя — имя задаётся хешем файла (см. CI и README).
      - source: prom_config
        target: /etc/prometheus/prometheus.yml
    networks:
      - monitoring_net
    ports:
      - "9090:9090"
    deploy:
      placement:
        constraints: [node.role == manager]

  loki:
    image: grafana/loki:2.9.2
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    configs:
      - source: loki_config_v1
        target: /etc/loki/local-config.yaml
    networks:
      - monitoring_net
    deploy:
      placement:
        constraints: [node.role == manager]

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - monitoring_net
    deploy:
      placement:
        constraints: [node.role == manager]

  node-exporter:
    image: prom/node-exporter:latest
    # Имя хоста ноды Swarm → в node_uname_info/nodename не id контейнера, а одна строка на машину
    hostname: "{{.Node.Hostname}}"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
    networks:
      - monitoring_net
    deploy:
      mode: global
      labels:
        prometheus-job: node-exporter

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.2 # Обновлено на стабильную новую версию
    hostname: "{{.Node.Hostname}}"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    command:
      - '--docker_only=true'          # Больше не будет лезть в /system.slice и крашиться
      - '--housekeeping_interval=15s' # Снижаем нагрузку на CPU
    networks:
      - monitoring_net
    deploy:
      mode: global
      labels:
        prometheus-job: cadvisor

  promtail:
    image: grafana/promtail:2.9.2
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    configs:
      - source: promtail_config_v1
        target: /etc/promtail/promtail-config.yaml
    networks:
      - monitoring_net
    deploy:
      mode: global

networks:
  monitoring_net:
    driver: overlay
    driver_opts:
      com.docker.network.driver.mtu: "1200" # СПАСАЕТ ОТ КОНФЛИКТА С NETBIRD

volumes:
  prometheus_data:
  loki_data:
  grafana_data:

configs:
  prom_config:
    name: monitoring_prom_${MONITORING_PROM_CONFIG_VERSION}
    file: ./prometheus.yml
  loki_config_v1:
    file: ./loki.yml
  promtail_config_v1:
    file: ./promtail.yml
