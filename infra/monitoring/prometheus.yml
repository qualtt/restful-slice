global:
  scrape_interval: 15s

scrape_configs:
  # Swarm tasks + port в SD (overlay, без publish на хост).
  # Отбор по имени сервиса <stack>_<service>, т.к. label prometheus-job в API бывает пустым.
  # instance → hostname ноды (если у ноды в Swarm задан нормальный hostname).
  - job_name: 'node-exporter'
    dockerswarm_sd_configs:
      - host: unix:///var/run/docker.sock
        role: tasks
        port: 9100
    relabel_configs:
      - source_labels: [__meta_dockerswarm_task_desired_state]
        regex: running
        action: keep
      - source_labels: [__meta_dockerswarm_service_name]
        regex: '.+_node-exporter'
        action: keep
      - source_labels: [__meta_dockerswarm_node_hostname]
        regex: (.+)
        replacement: ${1}:9100
        target_label: instance

  - job_name: 'cadvisor'
    dockerswarm_sd_configs:
      - host: unix:///var/run/docker.sock
        role: tasks
        port: 8080
    relabel_configs:
      - source_labels: [__meta_dockerswarm_task_desired_state]
        regex: running
        action: keep
      - source_labels: [__meta_dockerswarm_service_name]
        regex: '.+_cadvisor'
        action: keep
      - source_labels: [__meta_dockerswarm_node_hostname]
        regex: (.+)
        replacement: ${1}:8080
        target_label: instance
