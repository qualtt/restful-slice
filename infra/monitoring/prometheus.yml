global:
  scrape_interval: 15s

# DNS SD: стабильнее, чем dockerswarm SD + фильтры по имени (у Swarm имя бывает и `cadvisor`,
# и `monitoring_cadvisor` — от этого отваливаются все цели).
# Имя стека при деплое должно совпадать: `docker stack deploy ... monitoring`.
scrape_configs:
  - job_name: 'node-exporter'
    dns_sd_configs:
      - names: ['tasks.monitoring_node-exporter']
        type: 'A'
        port: 9100

  - job_name: 'cadvisor'
    dns_sd_configs:
      - names: ['tasks.monitoring_cadvisor']
        type: 'A'
        port: 8080
