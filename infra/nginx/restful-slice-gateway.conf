# Реальный vhost: монтируется как /etc/nginx/restful-slice-gateway.conf (не conf.d).
# Файл не .template — CRS envsubst не трогает, $host / $scheme остаются для nginx.
#
# listen 8080: образ CRS крутит nginx от непривилегированного пользователя — порты <1024
# запрещены; PORT в стеке = 8080, публикация на хосте «80:8080» (снаружи всё ещё :80).

server_tokens off;

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
# Только default-src 'self' ломает inline style (React) и часть легитимных подресурсов SPA.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self'" always;

upstream order_api {
    server order_service:8080;
}
upstream inv_api {
    server inventory_service:8081;
}

server {
    listen 8080;

    client_max_body_size 300M;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/orders {
        proxy_pass http://order_api;
    }

    location /api/telemetry {
        proxy_pass http://order_api;
    }

    location /api/inventory {
        proxy_pass http://inv_api;
    }

    location /health {
        access_log off;
        return 200 "Gateway is ALIVE\n";
    }

    # Образ по умолчанию проверяет https://localhost:8443/healthz; у нас только HTTP :8080 — healthcheck
    # переопределён в docker-stack.yml / compose на http://127.0.0.1:8080/healthz.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Vite-бандлы: ModSecurity на «толстом» application/javascript часто висит без ответа
    # (особенно при Range/chunk); WAF здесь не оправдан — имена имеют контент-хэш.
    location ^~ /assets/ {
        modsecurity off;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $frontend_upstream frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_pass http://$frontend_upstream:80;
    }

    # React SPA: proxy_pass через переменную + resolver 127.0.0.11 (embedded Docker DNS),
    # иначе nginx резолвит upstream только при старте и может получить «host not found»,
    # если задача gateway поднялась раньше, чем во overlay появилась запись frontend.
    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $frontend_upstream frontend;
        # HTTP/1.1 к upstream: иначе по умолчанию 1.0 без пайплайна; при Range/чанках иногда странное поведение.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Меньше буферизации тела через WAF-слой при отдаче крупных /assets/*.js .
        proxy_buffering off;
        proxy_pass http://$frontend_upstream:80;
    }
}
