# Реальный vhost: монтируется как /etc/nginx/restful-slice-gateway.conf (не conf.d).
# Файл не .template — CRS envsubst не трогает, $host / $scheme остаются для nginx.
#
# listen 8080: образ CRS крутит nginx от непривилегированного пользователя — порты <1024
# запрещены; PORT в стеке = 8080, публикация на хосте «80:8080» (снаружи всё ещё :80).

server_tokens off;

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Content-Security-Policy "default-src 'self';" always;

upstream order_api {
    server order_service:8080;
}
upstream inv_api {
    server inventory_service:8081;
}

server {
    listen 8080;

    client_max_body_size 300M;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/orders {
        proxy_pass http://order_api;
    }

    location /api/telemetry {
        proxy_pass http://order_api;
    }

    location /api/inventory {
        proxy_pass http://inv_api;
    }

    location /health {
        access_log off;
        return 200 "Gateway is ALIVE\n";
    }

    # Образ owasp/modsecurity-crs: встроенный HEALTHCHECK бьёт в /healthz (см. README CRS-docker).
    # Без этого контейнер вечно «health: starting», Swarm визуально «красный», снаружи порт может не отдаваться.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
