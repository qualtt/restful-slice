# Прокси к order_service / inventory_service. Крепится как default.conf.template в
# owasp/modsecurity-crs (как в docker-compose).
#
# Важно: образ гоняет envsubst по *.template. Двойные $$ как в официальном nginx-docker
# в этом образе дали на выходе «живой» $$ и падение: invalid variable name (строка с
# limit_req_zone). Rate limiting на границе убран — при необходимости вынесите в WAF
# или в отдельный nginx без CRS-шаблонов.

server_tokens off;

# Харденинг
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Content-Security-Policy "default-src 'self';" always;

upstream order_api {
    server order_service:8080;
}
upstream inv_api {
    server inventory_service:8081;
}

server {
    listen 80;

    client_max_body_size 300M;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/orders {
        proxy_pass http://order_api;
    }

    location /api/telemetry {
        proxy_pass http://order_api;
    }

    location /api/inventory {
        proxy_pass http://inv_api;
    }

    location /health {
        access_log off;
        return 200 "Gateway is ALIVE\n";
    }
}
