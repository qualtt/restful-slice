version: '3.8'



services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      ORDER_DB_USER: ${ORDER_DB_USER}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD}
      INV_DB_USER: ${INV_DB_USER}
      INV_DB_PASSWORD: ${INV_DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    networks:
      - backend_net
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RMQ_PASSWORD}
    networks:
      - backend_net
    ports:
      - "127.0.0.1:5672:5672"     # порт для кода
      - "127.0.0.1:15672:15672"   # админка
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    networks:
      - backend_net
    ports:
      - "127.0.0.1:9000:9000" # API
      - "127.0.0.1:9001:9001" # админка
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    volumes:
      - minio_data:/data
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

# то шо билдится

  order_service:
    build:
      context: ./services/order-service
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=${ORDER_PORT}
    volumes:
      # синхронизируем папку с кодом и папку /app в докере! В ПРОДЕ НАВЕРН ВЫПИЛЮ
      - ./services/order-service:/app
    networks:
      - public_net
      - backend_net
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  inventory_service:
    build:
      context: ./services/inventory-service
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=${INVENTORY_PORT}
    volumes:
      # Синхронизируем папку с кодом и папку /app в докере! В ПРОДЕ НАВЕРН ВЫПИЛЮ
      - ./services/inventory-service:/app
    networks:
      - public_net
      - backend_net
    depends_on:
      postgres:
        condition: service_healthy

  slicer_api:
    build:
      context: https://github.com/qualtt/orca-slicer-api.git#main
      args:
        ORCASLICER_VERSION: "2.3.0"
        TARGETARCH: "amd64"
    restart: unless-stopped
#    env_file: .env
#    environment:
#      - PORT=3000
#      - NODE_ENV=production
    networks:
      - slicer_internal_net
    volumes:
      - slicer_data:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy

  slicer_adapter:
    build:
      context: ./services/slicer-adapter
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - SLICER_API_URL=http://slicer_api:3000
    networks:
      - backend_net
      - slicer_internal_net
    depends_on:
      slicer_api:
        condition: service_started
      rabbitmq:
          condition: service_healthy
      minio:
        condition: service_healthy

# --- API GATEWAY & WAF ---
  gateway:
    image: owasp/modsecurity-crs:nginx-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - SEC_RULE_ENGINE=On
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/templates/conf.d/default.conf.template:ro
    networks:
      - public_net
    depends_on:
      - order_service
      - inventory_service

# ЯВНО ОБЪЯВЛЯЕМ СЕТИ И ТОМА!
networks:
  backend_net:
    driver: bridge
  public_net:
    driver: bridge
  slicer_internal_net:
    driver: bridge

volumes:
  pg_data:
  minio_data:
  slicer_data:
