# Глобальный блок env_file в версии 3.8 не поддерживается (и не нужен).
# Docker Compose САМ автоматически читает файл .env в папке и подставляет ${ПЕРЕМЕННЫЕ}.

# компоуз вроде не тронут, слава богу
services:
  postgres:
    build:
      context: ./infra/postgres
      dockerfile: Dockerfile
    image: restful-slice-postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      ORDER_DB_USER: ${ORDER_DB_USER}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD}
      ORDER_DB_NAME: ${ORDER_DB_NAME}
      INV_DB_USER: ${INV_DB_USER}
      INV_DB_PASSWORD: ${INV_DB_PASSWORD}
      INV_DB_NAME: ${INV_DB_NAME}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - backend_net
    # Биндим только на localhost! Никаких доступов извне.
    ports:
      - "127.0.0.1:5434:5432"
    # DEV-ПРАКТИКА: Проверка здоровья БД
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # DEV-ПРАКТИКА: Ограничение ресурсов (cgroups)
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RMQ_PASSWORD}
    networks:
      - backend_net
    ports:
      - "127.0.0.1:5672:5672" # Порт для кода
      - "127.0.0.1:15672:15672" # Админка
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    networks:
      - backend_net
    ports:
      - "127.0.0.1:9000:9000" # API
      - "127.0.0.1:9001:9001" # Админка
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    volumes:
      - minio_data:/data
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # То шо билдится

  order_service:
    build:
      context: ./services/order-service
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=${ORDER_PORT}
    networks:
      - public_net
      - backend_net
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  inventory_service:
    build:
      context: ./services/inventory-service
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=${INVENTORY_PORT}
    networks:
      - public_net
      - backend_net
    depends_on:
      postgres:
        condition: service_healthy

  slicer_api:
    build:
      context: https://github.com/qualtt/orca-slicer-api.git#main
      args:
        ORCASLICER_VERSION: "2.3.0"
        TARGETARCH: "amd64"
    restart: unless-stopped
    #    env_file: .env
    #    environment:
    #      - PORT=3000
    #      - NODE_ENV=production
    networks:
      - slicer_internal_net
    volumes:
      - slicer_data:/app/data
  #    depends_on:
  #      rabbitmq:
  #        condition: service_healthy
  #      minio:
  #        condition: service_healthy

  slicer_adapter:
    build:
      context: ./services/slicer-adapter
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - SLICER_API_URL=http://slicer_api:3000
    networks:
      - backend_net
      - slicer_internal_net
    depends_on:
      slicer_api:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    image: restful-slice-frontend:latest
    restart: unless-stopped
    networks:
      - public_net

  # --- API GATEWAY & WAF ---
  gateway:
    image: owasp/modsecurity-crs:nginx-alpine
    restart: unless-stopped
    ports:
      - "80:8080"
    environment:
      - MODSEC_RULE_ENGINE=DetectionOnly
      - PORT=8080
    volumes:
      - ./infra/nginx/default.conf.template:/etc/nginx/templates/conf.d/default.conf.template:ro
      - ./infra/nginx/restful-slice-gateway.conf:/etc/nginx/restful-slice-gateway.conf:ro
    networks:
      - public_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    depends_on:
      - frontend
      - order_service
      - inventory_service

# ЯВНО ОБЪЯВЛЯЕМ СЕТИ И ТОМА!
networks:
  backend_net:
    driver: bridge
  public_net:
    driver: bridge
  slicer_internal_net:
    driver: bridge

volumes:
  pg_data:
  minio_data:
  slicer_data:
